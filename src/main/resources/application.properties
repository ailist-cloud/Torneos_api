spring.datasource.url=jdbc:postgresql://localhost:5432/torneos_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:1023801019}

# validate: Hibernate revisa que las entidades coincidan con las tablas, pero no las modifica
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Permite enviar "programado" o "PROGRAMADO" en los JSON (enums sin importar mayusculas)
spring.jackson.mapper.accept-case-insensitive-enums=true
